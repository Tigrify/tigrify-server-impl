name: Functions CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r functions/requirements.txt
      - name: Run unit and OpenAPI contract tests
        run: python -m unittest discover -s functions/tests -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Python virtual environment for Firebase CLI
        run: |
          python -m venv functions/venv
          functions/venv/bin/pip install --upgrade pip
          functions/venv/bin/pip install -r functions/requirements.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools
